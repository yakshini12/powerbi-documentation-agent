<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 820" width="1060" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>

  <rect width="1060" height="820" fill="#ffffff"/>

  <text x="40" y="48" font-size="26" font-weight="600" fill="#1f2328">Technical Q&amp;A tool server (MCP)</text>
  <text x="40" y="76" font-size="15" fill="#57606a">Read-only, evidence-grounded answers about a report, exposed to the editor over stdio.</text>

  <!-- Editor -->
  <rect x="40" y="110" width="290" height="120" rx="10" fill="#f4f6f8" stroke="#c8d0d8" stroke-width="1.5"/>
  <text x="60" y="140" font-size="16" font-weight="600" fill="#1f2328">Editor chat</text>
  <text x="60" y="166" font-size="13.5" fill="#57606a">Developer asks a targeted</text>
  <text x="60" y="186" font-size="13.5" fill="#57606a">question about one report.</text>
  <text x="60" y="212" font-size="13" font-style="italic" fill="#8250df">"Which filters apply on this page?"</text>

  <!-- stdio transport -->
  <line x1="330" y1="170" x2="430" y2="170" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="340" y="160" font-size="12.5" fill="#57606a">stdio</text>

  <!-- Tool server -->
  <rect x="430" y="110" width="300" height="120" rx="10" fill="#ddf4ff" stroke="#1f6feb" stroke-width="1.8"/>
  <text x="450" y="140" font-size="16" font-weight="600" fill="#1f2328">documentation-agent server</text>
  <text x="450" y="166" font-size="13.5" fill="#57606a">Launched by the editor as a</text>
  <text x="450" y="186" font-size="13.5" fill="#57606a">local stdio process. Routes each</text>
  <text x="450" y="206" font-size="13.5" fill="#57606a">question to one narrow tool.</text>

  <!-- Evidence model -->
  <line x1="730" y1="170" x2="830" y2="170" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="830" y="110" width="190" height="120" rx="10" fill="#f4f6f8" stroke="#c8d0d8" stroke-width="1.5"/>
  <text x="850" y="140" font-size="16" font-weight="600" fill="#1f2328">Evidence model</text>
  <text x="850" y="166" font-size="13.5" fill="#57606a">Same extraction the</text>
  <text x="850" y="186" font-size="13.5" fill="#57606a">documents render from.</text>
  <text x="850" y="212" font-size="13" fill="#1a7f37">One extraction, many readers.</text>

  <!-- Read-only tools heading -->
  <text x="40" y="290" font-size="17" font-weight="600" fill="#1f2328">Read-only tools, grouped by question</text>
  <text x="40" y="314" font-size="13.5" fill="#57606a">Narrow by design: answering "what filters are on this page" never requires returning a whole lineage graph.</text>

  <!-- Group 1 -->
  <rect x="40" y="336" width="312" height="196" rx="10" fill="#ffffff" stroke="#c8d0d8" stroke-width="1.5"/>
  <rect x="40" y="336" width="312" height="36" rx="10" fill="#eef4ff"/>
  <text x="58" y="360" font-size="14.5" font-weight="600" fill="#1f6feb">Structure and filtering</text>
  <text x="58" y="398" font-size="13" fill="#1f2328">get_report_structure</text>
  <text x="58" y="422" font-size="13" fill="#1f2328">get_report_filters</text>
  <text x="58" y="446" font-size="13" fill="#1f2328">get_page_filters</text>
  <text x="58" y="470" font-size="13" fill="#1f2328">get_visual_filters</text>
  <text x="58" y="494" font-size="13" fill="#1f2328">get_slicer_state</text>
  <text x="58" y="518" font-size="12.5" fill="#57606a">Report / page / visual scope kept distinct.</text>

  <!-- Group 2 -->
  <rect x="374" y="336" width="312" height="196" rx="10" fill="#ffffff" stroke="#c8d0d8" stroke-width="1.5"/>
  <rect x="374" y="336" width="312" height="36" rx="10" fill="#eef4ff"/>
  <text x="392" y="360" font-size="14.5" font-weight="600" fill="#1f6feb">Measures and dependencies</text>
  <text x="392" y="398" font-size="13" fill="#1f2328">get_measure_dependencies</text>
  <text x="392" y="422" font-size="13" fill="#1f2328">get_measure_usage</text>
  <text x="392" y="446" font-size="13" fill="#1f2328">get_visual_dependencies</text>
  <text x="392" y="470" font-size="13" fill="#1f2328">get_source_dependencies</text>
  <text x="392" y="494" font-size="13" fill="#1f2328">get_report_dependencies</text>
  <text x="392" y="518" font-size="12.5" fill="#57606a">Answers "is this measure even used?"</text>

  <!-- Group 3 -->
  <rect x="708" y="336" width="312" height="196" rx="10" fill="#ffffff" stroke="#c8d0d8" stroke-width="1.5"/>
  <rect x="708" y="336" width="312" height="36" rx="10" fill="#eef4ff"/>
  <text x="726" y="360" font-size="14.5" font-weight="600" fill="#1f6feb">Lineage and impact</text>
  <text x="726" y="398" font-size="13" fill="#1f2328">get_report_lineage</text>
  <text x="726" y="422" font-size="13" fill="#1f2328">get_impact_analysis</text>
  <text x="726" y="446" font-size="13" fill="#1f2328">get_lineage_gaps</text>
  <text x="726" y="470" font-size="13" fill="#1f2328">search_report</text>
  <text x="726" y="494" font-size="13" fill="#1f2328">get_evidence</text>
  <text x="726" y="518" font-size="12.5" fill="#57606a">Bounded depth and edge caps by default.</text>

  <!-- Safety rules -->
  <text x="40" y="592" font-size="17" font-weight="600" fill="#1f2328">Safety rules built into how it is used</text>

  <rect x="40" y="614" width="646" height="166" rx="10" fill="#f6fdf8" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="60" y="644" font-size="14.5" font-weight="600" fill="#1a7f37">Allowed</text>
  <text x="60" y="672" font-size="13.5" fill="#1f2328">Read-only queries against extracted evidence.</text>
  <text x="60" y="696" font-size="13.5" fill="#1f2328">Targeted lineage with bounded depth, not full graphs by default.</text>
  <text x="60" y="720" font-size="13.5" fill="#1f2328">Inferred edges and unresolved hops reported as such, never as confirmed fact.</text>
  <text x="60" y="744" font-size="13.5" fill="#1f2328">Answers say "not evidenced" instead of filling a gap.</text>
  <text x="60" y="768" font-size="13.5" fill="#1f2328">Never used during business explanation. That boundary stays sealed.</text>

  <rect x="708" y="614" width="312" height="166" rx="10" fill="#fff5f5" stroke="#cf222e" stroke-width="1.5"/>
  <text x="726" y="644" font-size="14.5" font-weight="600" fill="#cf222e">Human approval required</text>
  <text x="726" y="672" font-size="13" fill="#1f2328">extract_and_cache</text>
  <text x="726" y="696" font-size="13" fill="#57606a">The one mutating operation:</text>
  <text x="726" y="716" font-size="13" fill="#57606a">it writes evidence and technical</text>
  <text x="726" y="736" font-size="13" fill="#57606a">artifacts to disk.</text>
  <text x="726" y="764" font-size="13" font-weight="600" fill="#cf222e">Never auto-invoked.</text>

  <line x1="864" y1="606" x2="864" y2="612" stroke="#cf222e" stroke-width="1.8" marker-end="url(#arrowRed)"/>
</svg>
